<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Calculate</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --navy: #1d3a5c;
      --key-dark: #2c4a72;
      --blue: #3d93ec;
      --orange: #f4a63a;
      --red: #f26b6b;
      --green: #2fc86a;
      --muted: #8a9bb0;
    }
    * { box-sizing: border-box; margin: 0; }
    html, body { height: 100%; }
    body {
      font-family: "Poppins", system-ui, sans-serif;
      background: linear-gradient(160deg, #8fc2e2, #5a9bc5);
      display: flex; align-items: center; justify-content: center;
    }
    .phone {
      width: 340px; height: 680px; padding: 26px 22px 18px;
      background: linear-gradient(180deg, #e4eff8, #cde1ee);
      border-radius: 36px;
      box-shadow: 0 24px 60px rgba(20, 60, 100, .35);
      display: flex; flex-direction: column;
    }
    h1 { text-align: center; font-size: 19px; font-weight: 600; color: var(--navy); }
    .display { margin-top: 22px; text-align: right; min-height: 78px; }
    #expr {
      width: 100%; border: 0; border-bottom: 2px solid transparent; background: transparent;
      outline: 0; text-align: right; padding: 2px 0 4px;
      font: 500 15px "Poppins", sans-serif; color: var(--navy); caret-color: var(--orange);
    }
    #expr:focus { border-bottom-color: rgba(61, 147, 236, .45); }
    #result { font-size: 32px; font-weight: 600; color: var(--navy); margin-top: 6px; word-break: break-all; }
    #result.error { font-size: 16px; color: var(--red); padding-top: 12px; }

    .keys { margin-top: 14px; display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px; }
    .key {
      aspect-ratio: 1; border: 0; border-radius: 18px; cursor: pointer;
      font: 600 20px "Poppins", sans-serif; color: #fff;
      box-shadow: 0 5px 0 rgba(0, 0, 0, .14), 0 8px 14px rgba(30, 70, 120, .18);
      transition: transform .08s, box-shadow .08s;
    }
    .key:active { transform: translateY(3px); box-shadow: 0 2px 0 rgba(0, 0, 0, .14); }
    .key:focus-visible { outline: 3px solid var(--navy); outline-offset: 2px; }
    .dark   { background: var(--key-dark); font-size: 16px; border-radius: 22px; aspect-ratio: 1.5; }
    .dark.on { background: var(--blue); }
    .blue   { background: var(--blue); }
    .orange { background: var(--orange); }
    .red    { background: var(--red); }
    .green  { background: var(--green); }

    .tabs {
      margin-top: auto; padding: 12px 22px; border-radius: 16px;
      background: rgba(255, 255, 255, .55);
      display: flex; justify-content: space-between;
    }
    .tabs svg { width: 22px; height: 22px; stroke: var(--navy); fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; opacity: .55; }
    .tabs svg.active { opacity: 1; }

    [hidden] { display: none !important; }
    .tabs { gap: 8px; }
    .tab { flex: 1; border: 0; background: none; padding: 8px 0; border-radius: 12px; cursor: pointer; display: flex; justify-content: center; }
    .tab.active { background: rgba(61, 147, 236, .16); }
    .tab:focus-visible { outline: 3px solid var(--navy); outline-offset: 2px; }
    .tab.active svg { opacity: 1; }
    .conv { margin-top: 22px; display: flex; flex-direction: column; gap: 12px; }
    .conv select, .conv input {
      width: 100%; padding: 13px 14px; border: 0; border-radius: 16px;
      background: rgba(255, 255, 255, .7); color: var(--navy);
      font: 500 16px "Poppins", sans-serif; box-shadow: 0 3px 10px rgba(30, 70, 120, .12);
    }
    .conv input { font-size: 26px; font-weight: 600; text-align: right; }
    .conv :focus-visible { outline: 3px solid var(--blue); outline-offset: 2px; }
    .swap { align-self: center; width: 44px; height: 44px; border: 0; border-radius: 50%; background: var(--blue); color: #fff; font-size: 20px; cursor: pointer; box-shadow: 0 4px 0 rgba(0,0,0,.14); }
    #cvOut { font-size: 30px; font-weight: 600; color: var(--navy); text-align: right; margin-top: 8px; word-break: break-all; }
    #cvOut.error { font-size: 16px; color: var(--red); }
    #cvNote { font-size: 12px; color: var(--muted); text-align: right; }

    @media (max-width: 420px) {
      .phone { width: 100%; height: 100%; border-radius: 0; }
    }
  </style>
</head>
<body>
  <main class="phone">
    <h1 id="title">Calculate</h1>

    <div id="p-calc">
    <section class="display" aria-live="polite">
      <input id="expr" type="text" autocomplete="off" spellcheck="false" autofocus aria-label="Expression" placeholder="Type or tap">
      <div id="result">0</div>
    </section>

    <section class="keys">
      <button class="key dark" data-k="e">e</button>
      <button class="key dark" data-k="%">%</button>
      <button class="key dark" data-k="sin">sin</button>
      <button class="key dark" data-k="deg" id="degBtn">deg</button>

      <button class="key red" data-k="C">C</button>
      <button class="key blue" data-k="(">(</button>
      <button class="key blue" data-k=")">)</button>
      <button class="key orange" data-k="÷">/</button>

      <button class="key blue" data-k="7">7</button>
      <button class="key blue" data-k="8">8</button>
      <button class="key blue" data-k="9">9</button>
      <button class="key orange" data-k="×">x</button>

      <button class="key blue" data-k="4">4</button>
      <button class="key blue" data-k="5">5</button>
      <button class="key blue" data-k="6">6</button>
      <button class="key orange" data-k="−">-</button>

      <button class="key blue" data-k="1">1</button>
      <button class="key blue" data-k="2">2</button>
      <button class="key blue" data-k="3">3</button>
      <button class="key orange" data-k="+">+</button>

      <button class="key blue" data-k="0">0</button>
      <button class="key blue" data-k="00">00</button>
      <button class="key blue" data-k=".">.</button>
      <button class="key green" data-k="=">=</button>
    </section>
    </div>

    <section class="conv" id="p-conv" hidden>
      <select id="cat" aria-label="Category" hidden></select>
      <input id="cvVal" type="text" inputmode="decimal" value="1" autocomplete="off" aria-label="Amount">
      <select id="cvFrom" aria-label="From"></select>
      <button class="swap" id="swap" aria-label="Swap">&#8645;</button>
      <select id="cvTo" aria-label="To"></select>
      <div id="cvOut" aria-live="polite">0</div>
      <div id="cvNote"></div>
    </section>

    <nav class="tabs" aria-label="Sections">
      <button class="tab active" data-tab="calc" aria-label="Calculator" aria-selected="true"><svg class="active" viewBox="0 0 24 24"><rect x="5" y="3" width="14" height="18" rx="2"/><path d="M9 7h6M9 12h.01M12 12h.01M15 12h.01M9 16h.01M12 16h.01M15 16h.01"/></svg></button>
      <button class="tab" data-tab="units" aria-label="Unit converter" aria-selected="false"><svg viewBox="0 0 24 24"><path d="M4 8h14l-3-3M20 16H6l3 3"/></svg></button>
      <button class="tab" data-tab="currency" aria-label="Currency converter" aria-selected="false"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c3 3 3 15 0 18M12 3c-3 3-3 15 0 18"/></svg></button>
    </nav>
  </main>

  <script>
    const exprEl = document.getElementById("expr");
    const resultEl = document.getElementById("result");
    const degBtn = document.getElementById("degBtn");

    let deg = false;
    let lastResult = null;
    let seq = 0;

    // Keyboard characters -> the symbols shown on the keys
    const MAP = { "*": "×", "x": "×", "X": "×", "/": "÷", "-": "−" };
    const ALLOWED = /[0-9+−×÷.()%esin]/;

    // Keep only valid characters and keep the cursor where the user was typing
    function clean(text, caret) {
      let out = "", newCaret = 0;
      for (let i = 0; i < text.length; i++) {
        if (i === caret) newCaret = out.length;
        const ch = MAP[text[i]] || text[i].toLowerCase();
        if (ALLOWED.test(ch)) out += ch;
      }
      if (caret >= text.length) newCaret = out.length;
      return { out, newCaret };
    }

    function show(value) {
      resultEl.classList.remove("error");
      resultEl.textContent = Number(value).toLocaleString("en-US", { maximumFractionDigits: 10 });
    }

    // Front end -> back end: send the expression to Flask and show what comes back
    async function compute(showError) {
      const mine = ++seq;
      const expr = exprEl.value;
      if (!expr) { lastResult = null; show(0); return; }

      const res = await fetch("/calculate", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ expr, deg })
      });
      const data = await res.json();
      if (mine !== seq) return; // a newer key press already took over

      if (data.error) {
        lastResult = null;
        if (showError) {
          resultEl.classList.add("error");
          resultEl.textContent = data.error;
        }
      } else {
        lastResult = data.result;
        show(data.result);
      }
    }

    // Insert text at the cursor (or over the selection)
    function insert(text) {
      exprEl.focus();
      exprEl.setRangeText(text, exprEl.selectionStart, exprEl.selectionEnd, "end");
      compute(false);
    }

    function clearAll() {
      exprEl.value = "";
      exprEl.focus();
      compute(false);
    }

    function equals() {
      if (lastResult !== null) {
        exprEl.value = String(lastResult).replace("-", "−");
        exprEl.setSelectionRange(exprEl.value.length, exprEl.value.length);
      }
      compute(true);
    }

    // Typing on the keyboard (and editing in the middle of the expression)
    exprEl.addEventListener("input", () => {
      const { out, newCaret } = clean(exprEl.value, exprEl.selectionStart);
      if (out !== exprEl.value) {
        exprEl.value = out;
        exprEl.setSelectionRange(newCaret, newCaret);
      }
      compute(false);
    });

    // Keep the cursor in the input when tapping on-screen keys
    const keys = document.querySelector(".keys");
    keys.addEventListener("mousedown", e => e.preventDefault());

    keys.addEventListener("click", e => {
      const btn = e.target.closest(".key");
      if (!btn) return;
      const k = btn.dataset.k;

      if (k === "C") clearAll();
      else if (k === "=") { exprEl.focus(); equals(); }
      else if (k === "deg") { deg = !deg; degBtn.classList.toggle("on", deg); compute(false); }
      else if (k === "sin") insert("sin(");
      else insert(k);
    });

    // Enter = equals, Esc = clear, and any typing goes to the expression
    document.addEventListener("keydown", e => {
      if (tab !== "calc" || e.ctrlKey || e.metaKey || e.altKey) return;
      if (e.key === "Enter") { e.preventDefault(); equals(); }
      else if (e.key === "Escape") clearAll();
      else if (document.activeElement !== exprEl && (e.key.length === 1 || e.key === "Backspace")) exprEl.focus();
    });

    // ---- Bottom menu: Calculator / Units / Currency ----
    let tab = "calc";
    const $ = id => document.getElementById(id);
    const titleEl = $("title"), calcPanel = $("p-calc"), convPanel = $("p-conv");
    const catSel = $("cat"), valEl = $("cvVal"), fromSel = $("cvFrom"), toSel = $("cvTo");
    const outEl = $("cvOut"), noteEl = $("cvNote");
    let unitsData = {};
    let cseq = 0;

    function fill(sel, items, selected) {
      sel.innerHTML = items.map(i => `<option value="${i}">${i}</option>`).join("");
      if (selected) sel.value = selected;
    }

    function setUnits(cat) {
      const list = unitsData[cat];
      fill(fromSel, list, list[0]);
      fill(toSel, list, list[1]);
    }

    async function runConvert() {
      const mine = ++cseq;
      const res = await fetch("/convert", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          kind: tab === "currency" ? "currency" : "unit",
          category: catSel.value, value: valEl.value, from: fromSel.value, to: toSel.value
        })
      });
      const data = await res.json();
      if (mine !== cseq) return;
      if (data.error) {
        outEl.classList.add("error");
        outEl.textContent = data.error;
        return;
      }
      outEl.classList.remove("error");
      outEl.textContent = Number(data.result).toLocaleString("en-US", { maximumFractionDigits: 6 }) + " " + toSel.value;
    }

    async function setTab(name) {
      tab = name;
      document.querySelectorAll(".tab").forEach(b => {
        const on = b.dataset.tab === name;
        b.classList.toggle("active", on);
        b.setAttribute("aria-selected", on);
      });
      calcPanel.hidden = name !== "calc";
      convPanel.hidden = name === "calc";

      if (name === "calc") { titleEl.textContent = "Calculate"; exprEl.focus(); return; }

      if (name === "units") {
        titleEl.textContent = "Convert units";
        catSel.hidden = false;
        noteEl.textContent = "";
        if (!Object.keys(unitsData).length) unitsData = await (await fetch("/units")).json();
        fill(catSel, Object.keys(unitsData));
        setUnits(catSel.value);
      } else {
        titleEl.textContent = "Currency";
        catSel.hidden = true;
        const info = await (await fetch("/rates")).json();
        fill(fromSel, info.codes, "USD");
        fill(toSel, info.codes, info.codes.includes("INR") ? "INR" : info.codes[1]);
        noteEl.textContent = info.live ? "Live exchange rates" : "Approximate rates (offline)";
      }
      valEl.value = "1";
      runConvert();
    }

    document.querySelector(".tabs").addEventListener("click", e => {
      const b = e.target.closest(".tab");
      if (b) setTab(b.dataset.tab);
    });
    catSel.addEventListener("change", () => { setUnits(catSel.value); runConvert(); });
    fromSel.addEventListener("change", runConvert);
    toSel.addEventListener("change", runConvert);
    valEl.addEventListener("input", runConvert);
    $("swap").addEventListener("click", () => {
      const a = fromSel.value;
      fromSel.value = toSel.value;
      toSel.value = a;
      runConvert();
    });

    exprEl.focus();
  </script>
</body>
</html>
